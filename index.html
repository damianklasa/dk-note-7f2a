<title>W przygotowaniu</title>
<style>
  :root {
    --paper: #f2ede2;
    --ink: #232922;
    --muted: #6f6a5a;
    --accent: #6b5a3e;
    --seal: #8a7550;
    --line: rgba(35, 41, 34, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #181b16;
      --ink: #e9e4d6;
      --muted: #a49d88;
      --accent: #c9a86a;
      --seal: #c9a86a;
      --line: rgba(233, 228, 214, 0.16);
    }
  }
  :root[data-theme="dark"] {
    --paper: #181b16;
    --ink: #e9e4d6;
    --muted: #a49d88;
    --accent: #c9a86a;
    --seal: #c9a86a;
    --line: rgba(233, 228, 214, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 26rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .seal {
    width: 3.25rem;
    height: 3.25rem;
    color: var(--seal);
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  p {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--muted);
    max-width: 30ch;
  }

  .rule {
    width: 2.5rem;
    height: 1px;
    background: var(--line);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .dot {
    width: 0.4rem;
    height: 0.4rem;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>

<div class="card">
  <svg class="seal" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3">
    <circle cx="24" cy="19" r="10" />
    <path d="M24 29 L24 40" />
    <path d="M17 34 L24 40 L31 34" />
    <path d="M19 19 L22 22 L29 15" stroke-width="1.5" />
  </svg>

  <h1>Coś tu wkrótce będzie</h1>
  <div class="rule"></div>
  <p>Ta strona jest jeszcze w przygotowaniu. Wróć tu ponownie, gdy nadejdzie właściwy moment.</p>

  <div class="status">
    <span class="dot"></span>
    <span>W przygotowaniu</span>
  </div>
</div>
