<title>Krok pierwszy</title>
<style>
  :root {
    --paper: #f2ede2;
    --ink: #232922;
    --muted: #6f6a5a;
    --accent: #6b5a3e;
    --seal: #8a7550;
    --line: rgba(35, 41, 34, 0.14);
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #181b16;
      --ink: #e9e4d6;
      --muted: #a49d88;
      --accent: #c9a86a;
      --seal: #c9a86a;
      --line: rgba(233, 228, 214, 0.16);
      --input-bg: #21251d;
    }
  }
  :root[data-theme="dark"] {
    --paper: #181b16;
    --ink: #e9e4d6;
    --muted: #a49d88;
    --accent: #c9a86a;
    --seal: #c9a86a;
    --line: rgba(233, 228, 214, 0.16);
    --input-bg: #21251d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 26rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 6.5vw, 1.8rem);
    font-weight: 400;
    line-height: 1.5;
    text-wrap: balance;
  }

  .rule {
    width: 2.5rem;
    height: 1px;
    background: var(--line);
  }

  .note {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 4.2vw, 1.1rem);
    line-height: 1.6;
    color: var(--muted);
    max-width: 32ch;
  }
</style>

<div class="card">
  <span class="eyebrow">Krok 1</span>
  <h1>Uwielbiasz koty, ale ten nigdy nie miauczy i nigdy nie ucieka. Jest niebieski i ma w sobie coś z łobuza.</h1>
  <div class="rule"></div>
  <p class="note">Rozwiązanie każdej zagadki wskaże Ci miejsce w mieszkaniu. Tam czeka kolejny krok.</p>
</div>
